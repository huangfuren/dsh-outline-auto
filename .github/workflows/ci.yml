# CI 工作流：每次向 main 分支推送或发起针对 main 的 PR 时，
# 在多个 Node.js 版本上执行类型检查、构建、测试、打包预演与安全审计。
name: CI

# 触发条件：
# - push 到 main 分支
# - 针对 main 分支的 pull_request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限原则：仅授予读取仓库内容的权限，避免工作流获得写权限令牌。
permissions:
  contents: read

jobs:
  # 校验任务：在矩阵中列出的每个 Node.js 版本 × 操作系统上运行同一套校验。
  # 覆盖 Windows / macOS / Linux，确认插件在三种平台（苹果与 Windows 用户）都能构建与测试。
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 即使某个版本失败也不中断其它版本，便于看全矩阵结果。
      fail-fast: false
      matrix:
        # Node 版本覆盖 engines 声明的兼容基线（22 / 24）；
        # 操作系统覆盖主流用户平台。
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # 拉取源码。
      - uses: actions/checkout@v4
      # 安装 pnpm（使用 lockfileVersion 对应的版本）。
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      # 安装指定版本的 Node，并缓存 pnpm 依赖以加速后续构建。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # 按 lockfile 精准安装依赖。
      - run: pnpm install --frozen-lockfile
      # 运行 package.json 中定义的 verify：类型检查 + 单测 + 冒烟。
      - run: pnpm run verify
      # 编译 TS 到 lib/，验证构建产物完整性。
      - run: pnpm build
      # 在不真正发布的情况下打包，验证 files 清单与打包完整性。
      # 注：pnpm pack 不支持 --ignore-scripts（npm pack 才有），prepack 会重新 build，幂等无害。
      - run: pnpm pack --dry-run
      # 仅审计生产依赖，且只报告 high 及以上级别的漏洞。
      - run: pnpm audit --prod --audit-level=high
